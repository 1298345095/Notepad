name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core without GUI dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure
        run: cmake -S . -B build-core -DNOTEPAD_BUILD_GUI=OFF -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-core --parallel 2
      - name: Test
        run: ctest --test-dir build-core --output-on-failure

  desktop:
    name: Desktop (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            cmake_args: -A x64
          - os: macos-15
            platform: macos-arm64
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0
          - os: ubuntu-24.04
            platform: linux-x64
            cmake_args: -G Ninja
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Linux build and display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libcurl4-openssl-dev ninja-build pkg-config xvfb xauth dpkg-dev
      - name: Configure with pinned wxWidgets
        run: >-
          cmake -S . -B build
          -DNOTEPAD_FETCH_WX=ON
          -DNOTEPAD_BUILD_GUI=ON
          -DBUILD_TESTING=ON
          -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake_args }}
      - name: Build
        run: cmake --build build --config Release --parallel 4
      - name: Run core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Stage application
        run: cmake --install build --config Release --prefix "$PWD/stage"
      - name: Smoke test installed Linux application
        if: runner.os == 'Linux'
        run: |
          timeout 90s xvfb-run -a stage/bin/Notepad --smoke-test --smoke-output "$PWD/smoke.json"
          python3 -c 'import json; json.load(open("smoke.json", encoding="utf-8"))'
      - name: Smoke test installed macOS application
        if: runner.os == 'macOS'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          subprocess.run([
              "stage/Notepad.app/Contents/MacOS/Notepad", "--smoke-test",
              "--smoke-output", str(Path("smoke.json").resolve()),
          ], check=True, timeout=90)
          json.load(open("smoke.json", encoding="utf-8"))
          PY
      - name: Smoke test installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = Join-Path $PWD 'smoke.json'
          $process = Start-Process -FilePath '.\stage\Notepad.exe' -ArgumentList @('--smoke-test', '--smoke-output', "`"$output`"") -PassThru
          if (-not $process.WaitForExit(90000)) {
            $process.Kill()
            throw 'GUI smoke test timed out.'
          }
          if ($process.ExitCode -ne 0) { throw "GUI smoke test failed: $($process.ExitCode)" }
          Get-Content -Raw $output | ConvertFrom-Json | Out-Null
      - name: Record Linux loading benchmark
        if: runner.os == 'Linux'
        run: |
          python3 tools/generate_fixture.py fixtures/10m.txt --size-mib 10
          timeout 90s xvfb-run -a stage/bin/Notepad --benchmark "$PWD/fixtures/10m.txt" --benchmark-output "$PWD/benchmark.json"
          python3 -c 'import json; json.load(open("benchmark.json", encoding="utf-8"))'
      - name: Package application
        run: cpack --config build/CPackConfig.cmake -C Release -B dist
      - name: Check Linux runtime dependency metadata
        if: runner.os == 'Linux'
        run: test -n "$(dpkg-deb -f dist/*.deb Depends)"
      - name: Upload application package
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: Notepad-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification records
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ matrix.platform }}
          path: |
            smoke.json
            smoke*.png
            benchmark.json
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
